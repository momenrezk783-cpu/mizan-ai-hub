name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-mizan-ai-hub
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Require a real D1 database id
        run: |
          if grep -q 'REPLACE_WITH_D1_DATABASE_ID' wrangler.toml; then
            echo "::error::wrangler.toml still contains a placeholder database id."
            exit 1
          fi
      - name: Require runtime secrets
        env:
          API_KEY_PEPPER: ${{ secrets.API_KEY_PEPPER }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          test -n "$API_KEY_PEPPER" || { echo "::error::Missing secret API_KEY_PEPPER"; exit 1; }
          test -n "$ADMIN_TOKEN" || { echo "::error::Missing secret ADMIN_TOKEN"; exit 1; }
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply mizan-ai-hub --remote
      - name: Push runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_KEY_PEPPER: ${{ secrets.API_KEY_PEPPER }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          umask 077
          jq -n '{API_KEY_PEPPER: env.API_KEY_PEPPER, ADMIN_TOKEN: env.ADMIN_TOKEN}' > "$RUNNER_TEMP/secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
